<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Justin Herman</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .thanks-page {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: #f7f4ed;
            text-align: center;
        }

        .thanks-box {
            max-width: 750px;
            background: white;
            padding: 70px 60px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
        }

        .thanks-box .eyebrow {
            color: #c15a32;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .thanks-box h1 {
            color: #245145;
            font-size: 52px;
            margin-bottom: 25px;
        }

        .thanks-box p {
            font-size: 19px;
            line-height: 1.8;
            color: #3f4d48;
            margin-bottom: 35px;
        }

        .thanks-box .button {
            display: inline-block;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .thanks-box {
                padding: 45px 25px;
            }

            .thanks-box h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Justin Herman</a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="resume.html">Resume</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main class="thanks-page">

        <div class="thanks-box">

            <p class="eyebrow">Message Sent</p>

            <h1>Thanks for Reaching Out!</h1>

            <p>
                Your message has been sent successfully.
                I appreciate you getting in touch, and I'll reach back out
                as soon as I can.
            </p>

            <a href="index.html" class="button">Return Home</a>

        </div>

    </main>

</body>

</html>
